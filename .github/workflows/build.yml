name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Verify Node Version
      run: node -v

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm install

    - name: Build Web
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Force Remove Local Java Paths from gradle.properties
      run: |
        find . -name "gradle.properties" -type f -exec sed -i '/org.gradle.java.home/d' {} +
        echo "Removed all org.gradle.java.home lines."

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ZLATKOALMODE-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk