name: Build SKOLKATA Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.*"
      - ".github/workflows/skolkata-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build SKOLKATA debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SKOLKATA source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload SKOLKATA APK
        uses: actions/upload-artifact@v4
        with:
          name: SKOLKATA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
