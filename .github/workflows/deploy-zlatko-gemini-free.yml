name: Deploy ZLATKO Gemini Free Worker

on:
  push:
    branches: ["main"]
    paths:
      - "zlatko-gemini-free/worker.js"
      - "zlatko-gemini-free/wrangler.toml"
      - ".github/workflows/deploy-zlatko-gemini-free.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy dedicated Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: zlatko-gemini-free
          command: deploy
      - name: Set Gemini API secret on the new Worker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: zlatko-gemini-free
        run: |
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY GitHub secret is missing" && exit 1)
          npx --yes wrangler@4 secret put GEMINI_API_KEY <<< "$GEMINI_API_KEY"
