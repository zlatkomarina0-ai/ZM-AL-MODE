name: Deploy ZLATKO Gemini Free Worker

on:
  push:
    branches: ["main"]
    paths:
      - "zlatko-gemini-free/worker.js"
      - "zlatko-gemini-free/wrangler.toml"
      - ".github/workflows/deploy-zlatko-gemini-free.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy dedicated Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: zlatko-gemini-free
          command: deploy
      - name: Set Gemini API secret on the new Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        working-directory: zlatko-gemini-free
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN GitHub secret is missing" && exit 1)
          test -n "$GEMINI_API_KEY" || (echo "GEMINI_API_KEY GitHub secret is missing" && exit 1)
          npx --yes wrangler@4 secret put GEMINI_API_KEY <<< "$GEMINI_API_KEY"
      - name: Smoke test Gemini chat endpoint
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            -X POST "https://zlatko-gemini-free.zlatkomarina0.workers.dev/v1/chat" \
            -H "Content-Type: application/json" \
            --data '{"messages":[{"role":"user","content":"Reply with exactly: ZLATKO_OK"}]}')"
          printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True, "Worker did not return ok=true: " + json.dumps(d); assert isinstance(d.get("text"), str) and d["text"].strip(), "Gemini returned empty text"; print("Gemini chat smoke test passed; model=" + str(d.get("model")) + "; response received.")'
