name: CI

on:
  pull_request:
    branches:
      - feature/zlatko-ai-architecture
      - feature/first-brain-core
  push:
    branches:
      - feature/zlatko-ai-architecture
      - feature/first-brain-core

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build web app
        run: npm run build
