name: Validate ZLATKO AI MODE

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "feature/first-brain-core", "feature/pluton-local-first" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run PLUTON tests
        run: npm run test:pluton

      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare-worker/worker.js

      - name: TypeScript and production build
        run: npm run build
